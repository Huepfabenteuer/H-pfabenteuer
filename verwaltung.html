<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0B6B6F"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Anfragen"/>
<title>Anfragen – Hüpfabenteuer</title>
<link rel="stylesheet" href="fonts.css?v=202610171625"/>
<style>
:root{
  --petrol:#0B6B6F; --petrol-d:#084F52; --petrol-l:rgba(11,107,111,.09);
  --sand:#EFE8DA; --paper:#FFFDF8; --ink:#1A1813; --ink-2:#46413A; --mute:#7A7366;
  --line:rgba(26,24,19,.12); --line-2:rgba(26,24,19,.2);
  --offen:#B7791F; --offen-l:rgba(183,121,31,.12);
  --fix:#1F7A4D; --fix-l:rgba(31,122,77,.12);
  --nein:#A8452A; --nein-l:rgba(168,69,42,.1);
  --sans:'Karla','Helvetica Neue',Arial,sans-serif;
  --serif:'Bodoni Moda','Didot','Times New Roman',serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--sand);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;}
body{min-height:100vh;min-height:100dvh;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:var(--petrol);}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px;border-radius:6px;}
[hidden]{display:none !important;}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}

/* ── Login ── */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px calc(32px + var(--safe-b));max-width:420px;margin:0 auto;}
.login h1{font-family:var(--serif);font-weight:400;font-size:2.4rem;line-height:1.05;margin-bottom:8px;}
.login p{color:var(--ink-2);margin-bottom:26px;}
.feld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.feld label{font-size:.85rem;font-weight:700;color:var(--ink-2);}
.feld input,.feld select,.feld textarea{width:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:16px;}
.feld input:focus,.feld textarea:focus,.feld select:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px rgba(11,107,111,.15);}
.btn{text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:1rem;transition:background .15s,transform .1s;}
.btn:active{transform:scale(.98);}
.btn-p{background:var(--petrol);color:#fff;}
.btn-p:hover{background:var(--petrol-d);}
.btn-g{background:var(--paper);color:var(--ink);border:1px solid var(--line-2);}
.btn-wa{background:#1FA855;color:#fff;}
.btn-wa:hover{background:#178a45;}
.btn-n{background:var(--paper);color:var(--nein);border:1px solid rgba(168,69,42,.35);}
.btn-w{width:100%;}
.btn[disabled]{opacity:.55;pointer-events:none;}
.fehler{color:var(--nein);font-weight:700;font-size:.92rem;min-height:1.3em;margin-top:6px;}

/* ── Kopf & Tabs ── */
.kopf{position:sticky;top:0;z-index:20;background:var(--sand);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;}
.kopf-z{display:flex;align-items:center;gap:10px;}
.kopf h1{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1;flex:1;}
.ikon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);}
.ikon:active{background:rgba(26,24,19,.06);}
.ikon.dreht svg{animation:dreh .8s linear infinite;}
@keyframes dreh{to{transform:rotate(360deg);}}
.tabs{display:flex;gap:4px;margin-top:12px;padding:4px;background:rgba(26,24,19,.06);border-radius:12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1 0 auto;padding:0 12px;white-space:nowrap;min-height:40px;border-radius:9px;font-weight:700;font-size:.92rem;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;}
.tab.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(26,24,19,.12);}
.zahl{min-width:22px;height:22px;padding:0 6px;border-radius:99px;font-size:.78rem;display:inline-flex;align-items:center;justify-content:center;background:rgba(26,24,19,.08);}
.tab[data-t="ausstehend"] .zahl.voll{background:var(--offen);color:#fff;}
.tab .stern{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;font-size:.78rem;background:#E8A317;color:#fff;}
.stern-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:800;color:#9A6A0B;background:rgba(232,163,23,.16);padding:2px 8px;border-radius:99px;}
.bew-status{font-size:.92rem;color:var(--ink-2);margin-bottom:10px;line-height:1.45;}

/* ── Liste ── */
.liste{padding:6px 12px calc(100px + var(--safe-b));display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;}
.gruppe{font-size:.88rem;font-weight:700;color:var(--mute);padding:14px 6px 2px;}
.karte{display:flex;gap:14px;align-items:stretch;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;}
.karte:active{background:#fff;}
.tag{flex:none;width:62px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;background:var(--offen-l);color:var(--offen);}
.karte[data-s="fix"] .tag{background:var(--fix-l);color:var(--fix);}
.karte[data-s="abgelehnt"] .tag,.karte[data-s="archiv"] .tag{background:rgba(26,24,19,.06);color:var(--mute);}
.tag-w{font-size:.75rem;font-weight:700;}
.tag-d{font-family:var(--serif);font-size:2rem;line-height:1;color:var(--ink);}
.tag-m{font-size:.75rem;font-weight:700;}
.k-mitte{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center;}
.k-prod{font-weight:800;font-size:1rem;line-height:1.25;}
.k-wer{color:var(--ink-2);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.k-info{color:var(--mute);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.k-rechts{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;}
.k-preis{font-weight:800;font-size:1.05rem;}
.warn{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:800;color:var(--nein);}
.leer{text-align:center;color:var(--mute);padding:60px 20px;}
.leer b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px;}

/* ── Detail ── */
.detail{position:fixed;inset:0;z-index:40;background:var(--sand);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);}
.detail.auf{transform:none;}
.d-kopf{position:sticky;top:0;z-index:2;background:var(--sand);display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;border-bottom:1px solid var(--line);}
.d-kopf h2{flex:1;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip{font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;}
.chip.ausstehend{background:var(--offen-l);color:var(--offen);}
.chip.fix{background:var(--fix-l);color:var(--fix);}
.chip.abgelehnt,.chip.archiv{background:rgba(26,24,19,.07);color:var(--mute);}
.gespeichert{font-size:.78rem;color:var(--mute);padding-right:6px;}
.d-inhalt{padding:14px 14px calc(150px + var(--safe-b));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.block{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;}
.block h3{font-size:.95rem;font-weight:800;margin-bottom:10px;}
.gross{font-family:var(--serif);font-size:1.7rem;line-height:1.1;}
.zeile{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:.95rem;}
.zeile span:first-child{color:var(--ink-2);}
.aktionen{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.aktionen .btn{min-height:46px;font-size:.92rem;}
.hinweis{border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.45;}
.hinweis.rot{background:var(--nein-l);color:#7E321D;}
.hinweis.gelb{background:var(--offen-l);color:#7A5113;}
.hinweis.gruen{background:var(--fix-l);color:#155A38;}
.emp-sw{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;line-height:1.4;cursor:pointer;}
.emp-sw input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--petrol);}
.nachricht{white-space:pre-wrap;color:var(--ink-2);font-size:.95rem;}

/* Positionen */
.pos{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr 78px 30px;gap:4px 6px;align-items:center;}
.pos:first-of-type{border-top:none;padding-top:0;}
.pos input{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;font-size:16px;}
.pos input:focus{outline:none;border-color:var(--petrol);background:#fff;}
.pos .p-t{font-weight:800;font-size:15px;text-overflow:ellipsis;}
.pos .p-x{grid-column:1 / 3;color:var(--mute);font-size:.86rem;padding-top:2px;padding-bottom:2px;}
.pos .p-b{text-align:right;font-weight:800;}
.pos .p-b.leer{border-color:var(--offen);background:var(--offen-l);}
.pos .weg{width:30px;height:34px;border-radius:9px;color:var(--mute);display:flex;align-items:center;justify-content:center;}
.pos .weg svg{width:18px;height:18px;}
.pos-neu{margin-top:6px;color:var(--petrol);font-weight:800;font-size:.92rem;min-height:40px;display:inline-flex;align-items:center;gap:6px;}
.summe{border-top:1.5px solid var(--ink);margin-top:8px;padding-top:10px;}
.summe .zeile:first-child{font-weight:800;font-size:1.1rem;}
.summe .zeile:first-child span:first-child{color:var(--ink);}
.anz{display:flex;align-items:center;gap:8px;}
.anz input{width:92px;text-align:right;padding:7px 8px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:16px;font-weight:700;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:rgba(26,24,19,.06);border-radius:10px;}
.seg button{min-height:38px;border-radius:7px;font-weight:700;font-size:.9rem;color:var(--ink-2);}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(26,24,19,.12);}

/* Leiste unten */
.leiste{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(239,232,218,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b));display:none;}
.detail.auf ~ .leiste{display:block;}
.leiste-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:8px;}
.leiste-in.eins{grid-template-columns:1fr;}

/* Sheet */
.schleier{position:fixed;inset:0;z-index:60;background:rgba(26,24,19,.4);opacity:0;pointer-events:none;transition:opacity .2s;}
.schleier.auf{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);border-radius:20px 20px 0 0;padding:10px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;max-height:88dvh;overflow-y:auto;}
.sheet.auf{transform:none;}
.griff{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:0 auto 14px;}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:1.6rem;line-height:1.15;margin-bottom:8px;}
.sheet p{color:var(--ink-2);margin-bottom:14px;}
.sheet .btn{margin-top:8px;}
.vorschau{background:#E7F6EC;border-radius:12px;padding:12px 14px;font-size:.88rem;white-space:pre-wrap;color:#1D3B28;max-height:220px;overflow-y:auto;margin-bottom:6px;}
.haken{width:56px;height:56px;border-radius:50%;background:var(--fix-l);color:var(--fix);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.haken svg{width:30px;height:30px;stroke-width:2.4;}

.wisch{position:relative;border-radius:14px;overflow:hidden;background:var(--sand);}
.wisch-akt{position:absolute;top:0;right:0;bottom:0;display:flex;}
.wisch-akt button{width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.78rem;font-weight:800;color:#fff;}
.wisch-akt button svg{width:22px;height:22px;}
.wa-grau{background:#6B6659;}
.wa-gelb{background:var(--offen);}
.wa-rot{background:var(--nein);}
.wa-gruen{background:var(--fix);}
.wisch .karte{position:relative;z-index:1;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform;}
.wisch.zieht .karte{transition:none;}
.wisch-tipp{font-size:.8rem;color:var(--mute);text-align:center;padding:2px 0 4px;}
.leeren{align-self:flex-end;color:var(--nein);font-weight:800;font-size:.9rem;min-height:40px;padding:0 6px;}
.toast button{color:#7FD8DA;font-weight:800;margin-left:14px;padding:4px 0;}
.toast:has(button){display:flex;align-items:center;white-space:nowrap;}
.toast.auf{pointer-events:auto;}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;}
.toast.auf{opacity:1;transform:translate(-50%,0);}
.fb-kopf{display:flex;align-items:center;gap:4px;padding:4px 2px 0;}
.fb-kopf b{font-size:1.15rem;min-width:52px;text-align:center;}
.fb-xls{margin-left:auto;min-height:42px;padding:8px 14px;font-size:.92rem;}
.fb-monate{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px;}
.fb-m{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-height:52px;font-weight:800;font-size:.9rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;}
.fb-m small{font-weight:600;font-size:.7rem;color:var(--mute);}
.fb-m.on{background:var(--petrol);border-color:var(--petrol);color:#fff;}
.fb-m.on small{color:rgba(255,255,255,.8);}
.fb-stand{font-weight:800;font-size:.85rem;color:var(--offen);background:var(--offen-l);padding:4px 10px;border-radius:99px;}
.fb-stand.ok{color:var(--fix);background:var(--fix-l);}
.fb-tipp{text-align:center;font-size:.85rem;color:var(--mute);margin:8px 0 4px;min-height:1.2em;}
.fb-e{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;}
.fb-e-k{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
.fb-e-k span{font-size:.88rem;color:var(--ink-2);}
.fb-d{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:#fff;font-size:16px;}
.fb-r{display:grid;grid-template-columns:68px minmax(0,1fr) 16px minmax(0,1fr);align-items:center;gap:5px;padding:4px 0;}
.fb-r span{font-size:.88rem;font-weight:700;color:var(--ink-2);}
.fb-r i{font-style:normal;text-align:center;color:var(--mute);font-size:.82rem;}
.fb-z{width:100%;min-width:0;min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:6px 8px;background:#fff;font-size:16px;text-align:center;}
.fb-z:focus,.fb-d:focus{outline:none;border-color:var(--petrol);}
.fb-z.blink{background:var(--fix-l);border-color:var(--fix);}
.fb-st{display:grid;grid-template-columns:68px repeat(3,minmax(0,1fr));gap:5px;align-items:start;padding-top:6px;margin-top:4px;border-top:1px dashed var(--line);}
.fb-st>span{font-size:.88rem;font-weight:700;color:var(--ink-2);padding-top:12px;}
.fb-s{display:flex;flex-direction:column;align-items:center;gap:2px;}
.fb-s small{font-size:.7rem;color:var(--mute);}
.fb-sn{width:100%;min-width:0;min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:6px 4px;background:#fff;font-size:16px;text-align:center;}
.fb-sn:focus{outline:none;border-color:var(--petrol);}
.fb-km{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:700;font-size:.92rem;}
.fb-km input{width:90px;text-align:right;border:1px solid var(--line-2);border-radius:8px;padding:8px;font-size:16px;font-weight:800;background:#fff;}
@media(min-width:520px){.fb-monate{grid-template-columns:repeat(12,1fr);}}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>

<!-- ══════════ Anmelden ══════════ -->
<section class="login" id="login" hidden>
  <h1>Anfragen</h1>
  <p>Hüpfabenteuer-Verwaltung. Gib dein Passwort ein, dann siehst du alle Anfragen.</p>
  <form id="loginForm" autocomplete="on">
    <div class="feld">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" autocomplete="current-password" required/>
    </div>
    <button class="btn btn-p btn-w" type="submit" id="loginBtn">Anmelden</button>
    <div class="fehler" id="loginFehler" role="alert"></div>
  </form>
</section>

<!-- ══════════ Übersicht ══════════ -->
<main id="app" hidden>
  <header class="kopf">
    <div class="kopf-z">
      <h1>Anfragen</h1>
      <button class="ikon" id="neuLaden" aria-label="Neu laden"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="ikon" id="abmelden" aria-label="Abmelden"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg></button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab on" data-t="ausstehend" role="tab">Offen <span class="zahl" id="z-ausstehend">0</span></button>
      <button class="tab" data-t="fix" role="tab">Fix <span class="zahl" id="z-fix">0</span><span class="stern" id="z-stern" hidden>★</span></button>
      <button class="tab" data-t="fahrten" role="tab"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M3 16V8h11v8M14 11h4l3 3v2h-7"/><circle cx="7" cy="17" r="1.8"/><circle cx="17" cy="17" r="1.8"/></svg>Fahrten</button>
      <button class="tab" data-t="abgelehnt" role="tab">Abgesagt <span class="zahl" id="z-abgelehnt">0</span></button>
      <button class="tab" data-t="archiv" role="tab">Archiv <span class="zahl" id="z-archiv">0</span></button>
      <button class="tab" data-t="papierkorb" role="tab" aria-label="Papierkorb"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="zahl" id="z-papierkorb">0</span></button>
    </nav>
  </header>
  <div class="liste" id="liste"></div>
</main>

<!-- ══════════ Detail ══════════ -->
<section class="detail" id="detail" aria-hidden="true">
  <div class="d-kopf">
    <button class="ikon" id="zurueck" aria-label="Zurück"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="dName"></h2>
    <span class="gespeichert" id="dGespeichert"></span>
    <span class="chip" id="dChip"></span>
  </div>
  <div class="d-inhalt" id="dInhalt"></div>
</section>
<div class="leiste" id="leiste"><div class="leiste-in" id="leisteIn"></div></div>

<div class="schleier" id="schleier"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="griff"></div><div id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var API = '/.netlify/functions/anfrage';
var KEY_NAME = 'hb_admin_key';
var schluessel = '';
var alle = [];
var tab = 'ausstehend';
var aktuell = null;          // offene Anfrage im Detail
var speicherTimer = null, speichertGerade = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function lsGet(){ try{ return localStorage.getItem(KEY_NAME) || ''; }catch(e){ return ''; } }
function lsSet(v){ try{ if(v) localStorage.setItem(KEY_NAME, v); else localStorage.removeItem(KEY_NAME); }catch(e){} }
function eur(n, immerKomma){
  if(n == null || n === '' || isNaN(Number(n))) return '–';
  var v = Math.round(Number(n)*100)/100;
  return v.toLocaleString('de-AT', {minimumFractionDigits: (immerKomma || v % 1) ? 2 : 0, maximumFractionDigits: 2}) + ' €';
}
var WT = ['So','Mo','Di','Mi','Do','Fr','Sa'], WTL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MO = ['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function tagDatum(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function heute(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function datumKurz(iso){ var d = tagDatum(iso); if(!d) return 'ohne Datum'; return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
function datumLang(iso){ var d = tagDatum(iso); return d ? WTL[d.getDay()] + ', ' + d.getDate() + '. ' + ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][d.getMonth()] + ' ' + d.getFullYear() : 'Kein Datum angegeben'; }
function inTagen(iso){
  var d = tagDatum(iso); if(!d) return '';
  var t = Math.round((d - heute())/864e5);
  if(t === 0) return 'heute'; if(t === 1) return 'morgen'; if(t === -1) return 'gestern';
  return t > 0 ? 'in ' + t + ' Tagen' : 'vor ' + (-t) + ' Tagen';
}
function wannEingegangen(iso){
  var t = (Date.now() - new Date(iso).getTime())/6e4;
  if(t < 2) return 'gerade eben'; if(t < 60) return 'vor ' + Math.round(t) + ' Min.';
  if(t < 1440) return 'vor ' + Math.round(t/60) + ' Std.';
  var d = Math.round(t/1440); return d === 1 ? 'gestern' : 'vor ' + d + ' Tagen';
}
function produkte(a){
  var p = (a.positionen || []).filter(function(x){ return x.art === 'miete'; }).map(function(x){ return x.titel; });
  return p.length ? p.join(' + ') : (a.typ === 'foto' ? 'Fotobox' : 'Hüpfburg');
}
function produktSchluessel(a){ return (a.positionen || []).filter(function(x){ return x.art === 'miete'; }).map(function(x){ return (x.titel || '').replace(/^Fotobox\b.*$/,'Fotobox').toLowerCase(); }); }
function tageVon(a){
  var s = tagDatum(a.datum); if(!s) return [];
  var e = tagDatum(a.datumEnde) || s, out = [];
  for(var d = new Date(s); d <= e && out.length < 14; d.setDate(d.getDate()+1)) out.push(d.toDateString());
  return out;
}
/* Gleiches Gerät am gleichen Tag schon fix? */
function konflikte(a){
  var tg = tageVon(a), pr = produktSchluessel(a);
  if(!tg.length || !pr.length) return [];
  return alle.filter(function(b){
    if(b.id === a.id || b.status !== 'fix') return false;
    var tb = tageVon(b); if(!tb.some(function(x){ return tg.indexOf(x) !== -1; })) return false;
    return produktSchluessel(b).some(function(x){ return pr.indexOf(x) !== -1; });
  });
}
function summen(a){
  var pos = a.positionen || [], miete = 0, liefer = 0, offen = false;
  pos.forEach(function(p){
    if(p.betrag == null || p.betrag === '' || isNaN(Number(p.betrag))){ offen = true; return; }
    if(p.art === 'lieferung') liefer += Number(p.betrag); else miete += Number(p.betrag);
  });
  miete = Math.round(miete*100)/100; liefer = Math.round(liefer*100)/100;
  var gesamt = Math.round((miete+liefer)*100)/100;
  var autoAnz = miete >= 300 ? 100 : miete >= 220 ? 50 : miete > 0 ? 30 : 0;
  var anz = (a.anzahlung != null && a.anzahlung !== '' && !isNaN(Number(a.anzahlung))) ? Number(a.anzahlung) : autoAnz;
  return {miete:miete, liefer:liefer, gesamt:gesamt, anzahlung:anz, autoAnz:autoAnz, rest:Math.round((gesamt-anz)*100)/100, offen:offen};
}
function tageSeit(iso){ return iso ? Math.floor((Date.now() - new Date(iso).getTime())/864e5) : 0; }
function bewertungStatus(a){
  if(a.status !== 'fix') return null;
  var ende = tagDatum(a.datumEnde || a.datum); if(!ende || ende >= heute()) return null;
  var b = a.bewertung || {};
  if(b.erhalten) return 'erhalten';
  if(!b.angefragtAm) return 'faellig';
  if(!b.erinnertAm && tageSeit(b.angefragtAm) >= (a.erinnerungNachTagen || 4)) return 'erinnern';
  return b.erinnertAm ? 'erinnert' : 'gefragt';
}
function waLink(nummer, text){ return 'https://wa.me/' + nummer + '?text=' + encodeURIComponent(text); }

var toastT;
function toast(t, rueck){
  var el = $('toast'); el.textContent = t;
  if(rueck){ var b = document.createElement('button'); b.textContent = 'Rückgängig'; b.addEventListener('click', function(){ el.classList.remove('auf'); rueck(); }); el.appendChild(b); }
  el.classList.add('auf'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('auf'); }, rueck ? 5000 : 2600);
}

/* ── Server ── */
function api(action, extra){
  var body = Object.assign({action: action}, extra || {});
  return fetch(API, {method:'POST', headers:{'Content-Type':'application/json','x-admin-key': schluessel}, body: JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){ return {ok:false, grund:'antwort'}; }).then(function(d){ d._status = r.status; return d; }); })
    .then(function(d){
      if(d._status === 401){ abmelden(d.grund === 'kein-admin-key' ? 'In Netlify fehlt noch die Variable ADMIN_KEY.' : 'Das Passwort stimmt nicht.'); throw new Error('401'); }
      if(!d.ok) throw new Error(d.grund || 'fehler');
      return d;
    });
}

/* ── Anmelden ── */
function zeigeLogin(fehler){ $('app').hidden = true; $('login').hidden = false; $('loginFehler').textContent = fehler || ''; setTimeout(function(){ $('pw').focus(); }, 50); }
function abmelden(fehler){ schluessel = ''; lsSet(''); schliesseDetail(true); zeigeLogin(fehler); }
$('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  schluessel = $('pw').value.trim(); if(!schluessel) return;
  $('loginBtn').disabled = true; $('loginFehler').textContent = '';
  laden().then(function(){ lsSet(schluessel); $('pw').value = ''; }).catch(function(){}).then(function(){ $('loginBtn').disabled = false; });
});
$('abmelden').addEventListener('click', function(){ abmelden(''); });

/* ── Laden & Liste ── */
function laden(still){
  $('neuLaden').classList.add('dreht');
  return api('liste').then(function(d){
    alle = d.anfragen || [];
    $('login').hidden = true; $('app').hidden = false;
    zeichneListe();
    if(aktuell){ var n = alle.filter(function(a){ return a.id === aktuell.id; })[0]; if(n && !speicherTimer){ aktuell = n; zeichneDetail(); } }
  }).catch(function(e){ if(e.message !== '401' && !still) toast('Laden hat nicht geklappt. Prüf die Verbindung.'); throw e; })
    .finally(function(){ $('neuLaden').classList.remove('dreht'); });
}
$('neuLaden').addEventListener('click', function(){ laden().catch(function(){}); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden && schluessel) laden(true).catch(function(){}); });

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){ tab = b.dataset.t; document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === b); }); zeichneListe(); window.scrollTo(0,0); });
});

var IK = {
  absagen: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>',
  archiv: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/></svg>',
  muell: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  zurueck: '<svg class="i" viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>'
};
function wischAktionen(a){
  var b = function(cls, act, ik, txt){ return '<button class="' + cls + '" data-act="' + act + '" data-id="' + esc(a.id) + '">' + IK[ik] + txt + '</button>'; };
  if(a.status === 'ausstehend') return b('wa-gelb','ablehnen','absagen','Absagen') + b('wa-rot','papierkorb','muell','Löschen');
  if(a.status === 'archiv') return b('wa-gruen','wiederherstellen','zurueck','Zurück') + b('wa-rot','papierkorb','muell','Löschen');
  if(a.status === 'papierkorb') return b('wa-gruen','wiederherstellen','zurueck','Zurück') + b('wa-rot','loeschen','muell','Weg');
  return b('wa-grau','archivieren','archiv','Archiv') + b('wa-rot','papierkorb','muell','Löschen');
}
function karte(a){
  var d = tagDatum(a.datum), s = summen(a), k = a.status === 'ausstehend' ? konflikte(a) : [];
  var ort = (a.adresse && a.adresse.ort) || '';
  var km = a.anreise && a.anreise.km ? a.anreise.km + ' km' : '';
  var info = a.status === 'ausstehend' ? 'Eingegangen ' + wannEingegangen(a.erstellt) : (a.nr ? 'Angebot ' + a.nr + (d ? ', ' + inTagen(a.datum) : '') : '');
  if(a.status === 'papierkorb' && a.geloeschtAm) info = 'Gelöscht ' + wannEingegangen(a.geloeschtAm);
  if(a.status === 'archiv') info = 'Archiviert' + (a.vorherStatus === 'fix' && a.nr ? ', Angebot ' + a.nr : '');
  return '<div class="wisch" data-id="' + esc(a.id) + '"><div class="wisch-akt">' + wischAktionen(a) + '</div><button class="karte" data-id="' + esc(a.id) + '" data-s="' + esc(a.status) + '">' +
    '<span class="tag">' + (d ? '<span class="tag-w">' + WT[d.getDay()] + '</span><span class="tag-d">' + d.getDate() + '</span><span class="tag-m">' + MO[d.getMonth()] + '</span>' : '<span class="tag-m">kein<br>Datum</span>') + '</span>' +
    '<span class="k-mitte"><span class="k-prod">' + esc(produkte(a)) + '</span>' +
    '<span class="k-wer">' + esc(((a.kunde.vorname || '') + ' ' + (a.kunde.nachname || '')).trim()) + (ort ? ', ' + esc(ort) : '') + '</span>' +
    '<span class="k-info">' + esc(info) + (km ? ' · ' + esc(km) : '') + '</span></span>' +
    '<span class="k-rechts"><span class="k-preis">' + (s.offen && !s.gesamt ? 'offen' : eur(s.gesamt)) + '</span>' +
    (k.length ? '<span class="warn"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Schon fix</span>' : '') +
    (s.offen && s.gesamt ? '<span class="warn" style="color:var(--offen)">Betrag fehlt</span>' : '') +
    (bewertungStatus(a) === 'faellig' ? '<span class="stern-badge">★ Bewertung</span>' : bewertungStatus(a) === 'erinnern' ? '<span class="stern-badge">★ Erinnern</span>' : '') +
    '</span></button></div>';
}

function zeichneListe(){
  var z = {ausstehend:0, fix:0, abgelehnt:0, archiv:0, papierkorb:0};
  alle.forEach(function(a){ if(z[a.status] != null) z[a.status]++; });
  var nStern = alle.filter(function(a){ var b = bewertungStatus(a); return b === 'faellig' || b === 'erinnern'; }).length;
  $('z-stern').hidden = !nStern; $('z-stern').textContent = '★ ' + nStern;
  Object.keys(z).forEach(function(k){ var el = $('z-' + k); el.textContent = z[k]; el.classList.toggle('voll', z[k] > 0); el.hidden = (k === 'papierkorb' || k === 'archiv') && !z[k]; });
  if(tab === 'fahrten'){ zeichneFahrten(); return; }
  var l = alle.filter(function(a){ return a.status === tab; }), html = '';
  if(tab === 'ausstehend'){
    l.sort(function(a,b){ return (b.erstellt || '').localeCompare(a.erstellt || ''); });
    html = l.map(karte).join('');
    if(!l.length) html = '<div class="leer"><b>Alles erledigt</b>Neue Anfragen von der Website landen hier.</div>';
  } else if(tab === 'fix'){
    var h = heute();
    var bew = l.filter(function(a){ var b = bewertungStatus(a); return b === 'faellig' || b === 'erinnern'; }).sort(function(a,b){ return (b.datum || '').localeCompare(a.datum || ''); });
    var kommend = l.filter(function(a){ var d = tagDatum(a.datumEnde || a.datum); return !d || d >= h; }).sort(function(a,b){ return (a.datum || '9').localeCompare(b.datum || '9'); });
    var vorbei = l.filter(function(a){ var d = tagDatum(a.datumEnde || a.datum); return d && d < h && bew.indexOf(a) === -1; }).sort(function(a,b){ return (b.datum || '').localeCompare(a.datum || ''); });
    html = (bew.length ? '<div class="gruppe">★ Um eine Bewertung bitten</div>' + bew.map(karte).join('') : '') +
           (kommend.length ? '<div class="gruppe">Kommende Termine</div>' + kommend.map(karte).join('') : '') +
           (vorbei.length ? '<div class="gruppe">Schon vorbei</div>' + vorbei.map(karte).join('') : '');
    if(!l.length) html = '<div class="leer"><b>Noch keine fixen Termine</b>Nimm eine offene Anfrage an, dann steht sie hier.</div>';
  } else {
    l.sort(function(a,b){ return (b.geaendert || b.erstellt || '').localeCompare(a.geaendert || a.erstellt || ''); });
    html = l.map(karte).join('');
    var LEER = {
      abgelehnt: '<b>Keine Absagen</b>Abgesagte Anfragen findest du hier wieder.',
      archiv: '<b>Archiv ist leer</b>Wisch eine Anfrage nach links und tipp auf „Archiv“, um sie aufzuheben.',
      papierkorb: '<b>Papierkorb ist leer</b>Gelöschte Anfragen bleiben hier, bis du sie endgültig entfernst.'
    };
    if(!l.length) html = '<div class="leer">' + LEER[tab] + '</div>';
    else if(tab === 'papierkorb') html = '<button class="leeren" id="leeren">Papierkorb leeren</button>' + html;
  }
  if(l.length && !html.includes('wisch-tipp') && !lsTipp()) html = '<div class="wisch-tipp">Tipp: Karte nach links wischen für mehr Aktionen</div>' + html;
  $('liste').innerHTML = html;
  $('liste').querySelectorAll('.karte').forEach(function(b){ b.addEventListener('click', function(e){ if(b.dataset.gewischt){ delete b.dataset.gewischt; e.preventDefault(); return; } if(offen && offen !== b.parentNode){ zuWisch(); return; } if(b.parentNode.classList.contains('offen')){ zuWisch(); return; } oeffneDetail(b.dataset.id); }); });
  $('liste').querySelectorAll('.wisch').forEach(wischbar);
  $('liste').querySelectorAll('.wisch-akt button').forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); aktionAusListe(b.dataset.act, b.dataset.id); }); });
  if($('leeren')) $('leeren').addEventListener('click', papierkorbLeeren);
}

/* ── Wischen ── */
function lsTipp(){ try{ return localStorage.getItem('hb_wisch_tipp') === '1'; }catch(e){ return true; } }
function tippGesehen(){ try{ localStorage.setItem('hb_wisch_tipp', '1'); }catch(e){} }
var offen = null, BREITE = 156;
function zuWisch(){ if(offen){ offen.classList.remove('offen'); offen.querySelector('.karte').style.transform = ''; offen = null; } }
function wischbar(w){
  var k = w.querySelector('.karte'), x0 = 0, y0 = 0, dx = 0, aktiv = false, richtung = null;
  k.addEventListener('touchstart', function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; aktiv = true; richtung = null; }, {passive:true});
  k.addEventListener('touchmove', function(e){
    if(!aktiv) return; var t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if(!richtung){ if(Math.abs(mx) < 8 && Math.abs(my) < 8) return; richtung = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; if(richtung === 'x'){ w.classList.add('zieht'); if(offen && offen !== w) zuWisch(); } }
    if(richtung !== 'x') return;
    var basis = w.classList.contains('offen') ? -BREITE : 0;
    dx = Math.max(-BREITE - 30, Math.min(0, basis + mx));
    k.style.transform = 'translateX(' + dx + 'px)';
  }, {passive:true});
  k.addEventListener('touchend', function(){
    if(!aktiv) return; aktiv = false; w.classList.remove('zieht');
    if(richtung !== 'x') return;
    k.dataset.gewischt = '1'; setTimeout(function(){ delete k.dataset.gewischt; }, 350);
    if(dx < -BREITE / 2){ k.style.transform = 'translateX(' + (-BREITE) + 'px)'; w.classList.add('offen'); offen = w; tippGesehen(); }
    else { k.style.transform = ''; w.classList.remove('offen'); if(offen === w) offen = null; }
  });
}
document.addEventListener('touchstart', function(e){ if(offen && !offen.contains(e.target)) zuWisch(); }, {passive:true});

var MELDUNG = {ablehnen:'Abgesagt', archivieren:'Ins Archiv verschoben', papierkorb:'In den Papierkorb verschoben', wiederherstellen:'Wiederhergestellt', loeschen:'Endgültig gelöscht'};
var GEGEN = {ablehnen:'zuruecksetzen', archivieren:'wiederherstellen', papierkorb:'wiederherstellen'};
function aktionAusListe(act, id, gefragt){
  if(act === 'loeschen' && !gefragt && !confirmLeise('Endgültig löschen? Das kann man nicht rückgängig machen.')) return;
  zuWisch();
  var vorher = alle.filter(function(a){ return a.id === id; })[0];
  api(act, {id: id}).then(function(d){
    if(act === 'loeschen'){ alle = alle.filter(function(a){ return a.id !== id; }); }
    else { var i = alle.findIndex(function(x){ return x.id === id; }); if(i !== -1) alle[i] = d.anfrage; }
    zeichneListe();
    var gegen = GEGEN[act];
    toast(MELDUNG[act], gegen && vorher ? function(){
      var ziel = act === 'ablehnen' ? 'zuruecksetzen' : 'wiederherstellen';
      api(ziel, {id: id}).then(function(d2){ var i = alle.findIndex(function(x){ return x.id === id; }); if(i !== -1) alle[i] = d2.anfrage; zeichneListe(); toast('Rückgängig gemacht'); }).catch(function(){});
    } : null);
  }).catch(function(e){ if(e.message !== '401') toast('Das hat nicht geklappt. Versuch es nochmal.'); });
}
function papierkorbLeeren(){
  var weg = alle.filter(function(a){ return a.status === 'papierkorb'; });
  if(!weg.length || !confirmLeise(weg.length + (weg.length === 1 ? ' Anfrage' : ' Anfragen') + ' endgültig löschen?')) return;
  Promise.all(weg.map(function(a){ return api('loeschen', {id: a.id}).then(function(){ return a.id; }).catch(function(){ return null; }); })).then(function(ids){
    alle = alle.filter(function(a){ return ids.indexOf(a.id) === -1; }); zeichneListe(); toast('Papierkorb geleert');
  });
}

/* ── Detail ── */
function oeffneDetail(id){
  aktuell = alle.filter(function(a){ return a.id === id; })[0]; if(!aktuell) return;
  aktuell = JSON.parse(JSON.stringify(aktuell));
  zeichneDetail();
  $('detail').scrollTop = 0;
  $('detail').classList.add('auf'); $('detail').setAttribute('aria-hidden','false');
  try{ history.pushState({detail:id}, ''); }catch(e){}
}
function schliesseDetail(ohneHistory){
  if(!$('detail').classList.contains('auf')) return;
  sofortSpeichern();
  $('detail').classList.remove('auf'); $('detail').setAttribute('aria-hidden','true');
  aktuell = null; zeichneListe();
  if(!ohneHistory){ try{ if(history.state && history.state.detail) history.back(); }catch(e){} }
}
$('zurueck').addEventListener('click', function(){ schliesseDetail(); });
window.addEventListener('popstate', function(e){
  var st = e.state || {};
  if($('sheet').classList.contains('auf') && !st.sheet){ $('schleier').classList.remove('auf'); $('sheet').classList.remove('auf'); }
  if($('detail').classList.contains('auf') && !st.detail && !st.sheet) schliesseDetail(true);
});

var STATUS_TEXT = {ausstehend:'Offen', fix:'Fix', abgelehnt:'Abgesagt', archiv:'Archiv', papierkorb:'Papierkorb'};

function zeichneDetail(){
  var a = aktuell, s = summen(a), k = konflikte(a);
  var name = ((a.kunde.vorname || '') + ' ' + (a.kunde.nachname || '')).trim() || 'Ohne Namen';
  $('dName').textContent = name;
  $('dChip').textContent = STATUS_TEXT[a.status] || a.status; $('dChip').className = 'chip ' + a.status;
  var adr = [a.adresse.strasse, ((a.adresse.plz || '') + ' ' + (a.adresse.ort || '')).trim()].filter(Boolean).join(', ');
  var h = '';

  if(k.length){
    h += '<div class="hinweis rot"><b>Achtung:</b> ' + esc(produkte(a)) + ' ist an dem Tag schon fix vergeben (' +
      k.map(function(b){ return esc((b.kunde.vorname || '') + ' ' + (b.kunde.nachname || '')).trim() + (b.nr ? ', Angebot ' + b.nr : ''); }).join('; ') + ').</div>';
  }
  if(a.status === 'fix' && a.geaendertNachVersand) h += '<div class="hinweis gelb" id="hGeaendert"><b>Geändert nach dem Senden.</b> Das PDF, das der Kunde schon hat, bleibt so wie es war. Soll er die neue Version bekommen, tipp unten auf „Neues Angebot senden“.</div>';
  if(a.status === 'fix') h += '<div class="hinweis gruen">Termin ist fix. Angebot ' + esc(a.nr) + ' wurde ' + (a.angenommenAm ? 'am ' + new Date(a.angenommenAm).toLocaleDateString('de-AT') + ' ' : '') + 'erstellt.</div>';

  /* Bewertung */
  var bs = bewertungStatus(a), bw = a.bewertung || {};
  if(bs){

/* ── Speichern ── */
function planeSpeichern(){
  $('dGespeichert').textContent = 'Ändert …';
  clearTimeout(speicherTimer);

function sofortSpeichern(){
  if(!speicherTimer || !aktuell) return speichertGerade || Promise.resolve();
  clearTimeout(speicherTimer); speicherTimer = null;
  var a = aktuell;
  var patch = {positionen: a.positionen, anrede: a.anrede || '', notiz: a.notiz || '', anzahlung: a.anzahlung, empfehlung: a.empfehlung || {aktiv:false, code:''}};
  speichertGerade = api('speichern', {id: a.id, patch: patch}).then(function(d){
    var i = alle.findIndex(function(x){ return x.id === d.anfrage.id; }); if(i !== -1) alle[i] = d.anfrage;
    if(aktuell && aktuell.id === d.anfrage.id){ aktuell.pdf = d.anfrage.pdf; aktuell.waText = d.anfrage.waText; aktuell.waAbsage = d.anfrage.waAbsage; aktuell.empfehlung = d.anfrage.empfehlung; if(!!d.anfrage.geaendertNachVersand !== !!aktuell.geaendertNachVersand){ aktuell.geaendertNachVersand = d.anfrage.geaendertNachVersand; zeichneLeiste(); if(!$('hGeaendert') && aktuell.geaendertNachVersand) toast('Geändert. Das gesendete PDF bleibt gleich.'); } if($('empInfo') && d.anfrage.empfehlung && d.anfrage.empfehlung.aktiv && d.anfrage.empfehlung.code) $('empInfo').textContent = 'Code ' + d.anfrage.empfehlung.code + ' · Link steht in der WhatsApp-Nachricht'; if(aktuell.status === 'fix' && $('lWa')) $('lWa').href = waLink(aktuell.waNummer, aktuell.waText); }
    $('dGespeichert').textContent = 'Gespeichert';
    setTimeout(function(){ if($('dGespeichert').textContent === 'Gespeichert') $('dGespeichert').textContent = ''; }, 1500);
  }).catch(function(e){ if(e.message !== '401'){ $('dGespeichert').textContent = 'Nicht gespeichert'; toast('Speichern hat nicht geklappt.'); } })
    .finally(function(){ speichertGerade = null; });
  return speichertGerade;
}

  );
  if($('aWa')) $('aWa').addEventListener('click', function(){ statusAendern('ablehnen', 'Abgesagt'); schliesseSheet(); });
  $('aNur').addEventListener('click', function(){ statusAendern('ablehnen', 'Abgesagt'); schliesseSheet(); });
  $('aAbbruch').addEventListener('click', schliesseSheet);
}

function statusAendern(action, meldung){
  var a = aktuell; if(!a) return;
  Promise.resolve(sofortSpeichern()).then(function(){ return api(action, {id: a.id}); }).then(function(d){
    var i = alle.findIndex(function(x){ return x.id === d.anfrage.id; }); if(i !== -1) alle[i] = d.anfrage;
    toast(meldung); schliesseDetail();
  }).catch(function(e){ if(e.message !== '401') toast('Das hat nicht geklappt. Versuch es nochmal.'); });
}

function kopieren(t){
  function ok(){ toast('Text kopiert'); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok, alt); } else alt();
  function alt(){ var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){} document.body.removeChild(ta); }
}

/* ── Sheet ── */
function oeffneSheet(html){
  $('sheetIn').innerHTML = html;
  $('schleier').classList.add('auf'); $('sheet').classList.add('auf');
  try{ history.pushState({sheet:1}, ''); }catch(e){}
}
function schliesseSheet(){
  if(!$('sheet').classList.contains('auf')) return;
  $('schleier').classList.remove('auf'); $('sheet').classList.remove('auf');
  try{ if(history.state && history.state.sheet) history.back(); }catch(e){}
}
$('schleier').addEventListener('click', schliesseSheet);

/* ══════════ Fahrtenbuch ══════════
   Jede fixe Buchung hat zwei Einsätze: Lieferung (Datum = Festtag) und
   Abholung (Datum frei, Standard: Tag danach). Pro Einsatz Hin- und Rückfahrt
   mit Abfahrt und Ankunft. Daraus wird die Excel-Liste je Monat gebaut. */
var MONATE = ['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
var START = 'Glödnitz, Schulstraße 3';
var fbJahr = new Date().getFullYear(), fbMonat = new Date().getMonth();
function istFixA(a){ return a.status === 'fix' || (a.status === 'archiv' && a.vorherStatus === 'fix'); }
function plusTag(iso, n){ var d = tagDatum(iso); if(!d) return ''; d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function fbKm(a){
  if(a.fahrten && a.fahrten.km != null) return a.fahrten.km;
  if(a.anreise && a.anreise.km) return a.anreise.km;
  var l = (a.positionen || []).filter(function(p){ return p.art === 'lieferung' && Number(p.betrag) > 0; })[0];
  return l ? Math.round(Number(l.betrag) / 2.2) : 0;
}
function fbDaten(a){
  var f = a.fahrten || {};
  var leer = function(){ return {ab:'', an:''}; };
  function e(x, datum){ x = x || {}; return {datum: x.datum || datum, hin: x.hin || leer(), rueck: x.rueck || leer(), stand: x.stand || {start:null, kunde:null, ende:null}}; }
  return {liefer: e(f.liefer, a.datum), abhol: e(f.abhol, plusTag(a.datumEnde || a.datum, 1)), km: fbKm(a), notiz: f.notiz || '', fahrzeug: f.fahrzeug || fbFahrzeugMerk()};
}
function fbFahrzeugMerk(){ try{ return localStorage.getItem('hb_fahrzeug') || ''; }catch(e){ return ''; } }
function fbZiel(a){ return [a.adresse && a.adresse.strasse, ((a.adresse && a.adresse.plz) || '') + ' ' + ((a.adresse && a.adresse.ort) || '')].filter(function(x){ return x && x.trim(); }).join(', ') || 'Kunde'; }
function fbFelder(f){ return [f.liefer.hin.ab, f.liefer.hin.an, f.liefer.rueck.ab, f.liefer.rueck.an, f.abhol.hin.ab, f.abhol.hin.an, f.abhol.rueck.ab, f.abhol.rueck.an]; }
function fbFertig(f){ return fbFelder(f).filter(Boolean).length; }

/* Alle Fahrten (Zeilen) eines Jahres */
function fbZeilen(jahr){
  var out = [];
  alle.filter(istFixA).forEach(function(a){
    var f = fbDaten(a), ziel = fbZiel(a), wer = ((a.kunde.vorname || '') + ' ' + (a.kunde.nachname || '')).trim();
    [['liefer','Lieferung'],['abhol','Abholung']].forEach(function(e){
      var x = f[e[0]]; if(!x.datum || x.datum.slice(0,4) !== String(jahr)) return;
      var st = x.stand || {}, d1 = (st.start != null && st.kunde != null) ? st.kunde - st.start : null, d2 = (st.kunde != null && st.ende != null) ? st.ende - st.kunde : null;
      out.push({datum:x.datum, ab:x.hin.ab, an:x.hin.an, von:START, nach:ziel, zweck:e[1] + ' ' + produkte(a) + ' (Hinfahrt)', kunde:wer, nr:a.nr || '', km: d1 != null && d1 >= 0 ? d1 : f.km, kmA: st.start, kmE: st.kunde, fz: f.fahrzeug});
      out.push({datum:x.datum, ab:x.rueck.ab, an:x.rueck.an, von:ziel, nach:START, zweck:e[1] + ' ' + produkte(a) + ' (Rückfahrt)', kunde:wer, nr:a.nr || '', km: d2 != null && d2 >= 0 ? d2 : f.km, kmA: st.kunde, kmE: st.ende, fz: f.fahrzeug});
    });
  });
  return out.sort(function(x, y){ return (x.datum + (x.ab || '99')).localeCompare(y.datum + (y.ab || '99')); });
}

function zeichneFahrten(){
  var zeilen = fbZeilen(fbJahr);
  var proMonat = MONATE.map(function(_, m){ return zeilen.filter(function(z){ return +z.datum.slice(5,7) === m + 1; }); });
  var html = '<div class="fb-kopf"><button class="ikon" id="fbVor" aria-label="Jahr zurück"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>' + fbJahr + '</b><button class="ikon" id="fbNach" aria-label="Jahr vor"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>' +
    '<button class="btn btn-p fb-xls" id="fbXls"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Excel ' + fbJahr + '</button></div>';
  html += '<div class="fb-monate">' + MONATE.map(function(n, m){
    var km = proMonat[m].reduce(function(s, z){ return s + (Number(z.km) || 0); }, 0);
    return '<button class="fb-m' + (m === fbMonat ? ' on' : '') + '" data-m="' + m + '">' + n.slice(0,3) + (km ? '<small>' + Math.round(km) + ' km</small>' : '<small>–</small>') + '</button>';
  }).join('') + '</div>';
  var buchungen = alle.filter(istFixA).filter(function(a){
    var f = fbDaten(a);
    return [f.liefer.datum, f.abhol.datum].some(function(d){ return d && +d.slice(0,4) === fbJahr && +d.slice(5,7) === fbMonat + 1; });
  }).sort(function(a, b){ return (a.datum || '').localeCompare(b.datum || ''); });
  var kmM = proMonat[fbMonat].reduce(function(s, z){ return s + (Number(z.km) || 0); }, 0);
  html += '<div class="gruppe">' + MONATE[fbMonat] + ' ' + fbJahr + (kmM ? ' · ' + Math.round(kmM) + ' km' : '') + '</div>';
  if(!buchungen.length) html += '<div class="leer"><b>Keine Fahrten</b>Fixe Buchungen in diesem Monat erscheinen hier automatisch.</div>';
  html += buchungen.map(function(a){
    var f = fbDaten(a), n = fbFertig(f), d = tagDatum(a.datum);
    return '<button class="karte fb-karte" data-fb="' + esc(a.id) + '">' +
      '<span class="tag" style="background:var(--petrol-l);color:var(--petrol)">' + (d ? '<span class="tag-w">' + WT[d.getDay()] + '</span><span class="tag-d">' + d.getDate() + '</span><span class="tag-m">' + MO[d.getMonth()] + '</span>' : '') + '</span>' +
      '<span class="k-mitte"><span class="k-prod">' + esc(produkte(a)) + '</span><span class="k-wer">' + esc(fbZiel(a)) + '</span>' +
      '<span class="k-info">Abholung ' + esc(datumKurz(f.abhol.datum)) + ' · 4 × ' + esc(String(f.km).replace('.', ',')) + ' km</span></span>' +
      '<span class="k-rechts"><span class="fb-stand' + (n === 8 ? ' ok' : '') + '">' + (n === 8 ? '✓ fertig' : n + '/8') + '</span></span></button>';
  }).join('');
  $('liste').innerHTML = html;
  $('fbVor').onclick = function(){ fbJahr--; zeichneFahrten(); };
  $('fbNach').onclick = function(){ fbJahr++; zeichneFahrten(); };
  $('fbXls').onclick = function(){ excelExport(fbJahr); };
  $('liste').querySelectorAll('.fb-m').forEach(function(b){ b.onclick = function(){ fbMonat = +b.dataset.m; zeichneFahrten(); }; });
  $('liste').querySelectorAll('[data-fb]').forEach(function(b){ b.onclick = function(){ fahrtenSheet(b.dataset.fb); }; });
}

function fahrtenSheet(id){
  var a = alle.filter(function(x){ return x.id === id; })[0]; if(!a) return;
  var f = fbDaten(a);
  function zeit(pfad, wert){ return '<input type="time" class="fb-z" data-p="' + pfad + '" value="' + esc(wert) + '"/>'; }
  function stand(pfad, wert, lbl){ return '<label class="fb-s"><input type="number" inputmode="numeric" class="fb-sn" data-p="' + pfad + '" value="' + (wert == null ? '' : esc(String(wert))) + '" placeholder="–"/><small>' + lbl + '</small></label>'; }
  function einsatz(key, titel, datumFix){
    var x = f[key];
    return '<div class="fb-e"><div class="fb-e-k"><b>' + titel + '</b>' +
      (datumFix ? '<span>' + esc(datumLang(x.datum)) + '</span>' : '<input type="date" class="fb-d" data-p="' + key + '.datum" value="' + esc(x.datum) + '"/>') + '</div>' +
      '<div class="fb-r"><span>Hinfahrt</span>' + zeit(key + '.hin.ab', x.hin.ab) + '<i>bis</i>' + zeit(key + '.hin.an', x.hin.an) + '</div>' +
      '<div class="fb-r"><span>Rückfahrt</span>' + zeit(key + '.rueck.ab', x.rueck.ab) + '<i>bis</i>' + zeit(key + '.rueck.an', x.rueck.an) + '</div>' +
      '<div class="fb-st"><span>km-Stand</span>' + stand(key + '.stand.start', x.stand.start, 'Abfahrt') + stand(key + '.stand.kunde', x.stand.kunde, 'beim Kunden') + stand(key + '.stand.ende', x.stand.ende, 'zurück') + '</div></div>';
  }
  oeffneSheet(
    '<h3>Fahrtenbuch</h3><p style="margin-bottom:10px">' + esc(produkte(a)) + ' · ' + esc(fbZiel(a)) + '</p>' +
    '<button class="btn btn-p btn-w" id="fbJetzt"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Jetzt eintragen</button>' +
    '<div class="fb-tipp" id="fbTipp"></div>' +
    einsatz('liefer', 'Lieferung', true) + einsatz('abhol', 'Abholung', false) +
    '<div class="fb-km"><span>Fahrzeug</span><input type="text" id="fbFz" value="' + esc(f.fahrzeug) + '" placeholder="z. B. VW Caddy · SP-123AB" style="width:62%;text-align:left;font-weight:700"/></div>' +
    '<div class="fb-km"><span>Kilometer pro Strecke</span><input type="number" inputmode="decimal" id="fbKmIn" value="' + esc(String(f.km)) + '"/></div>' +
    '<div class="gespeichert" id="fbGesp" style="text-align:center;padding-top:8px"></div>'
  );
  var T;
  function setze(pfad, wert){ var t = pfad.split('.'), o = f; for(var i = 0; i < t.length - 1; i++) o = o[t[i]]; o[t[t.length-1]] = wert; }
  function naechstes(){ return [].filter.call($('sheetIn').querySelectorAll('.fb-z'), function(i){ return !i.value; })[0]; }
  function tipp(){
    var n = naechstes(), r = n && n.closest('.fb-r'), e = n && n.closest('.fb-e');
    $('fbTipp').textContent = n ? 'Als Nächstes: ' + e.querySelector('b').textContent + ', ' + r.querySelector('span').textContent + (n === r.querySelectorAll('.fb-z')[0] ? ' Abfahrt' : ' Ankunft') : 'Alle Zeiten eingetragen ✓';
    $('fbJetzt').disabled = !n;
  }
  function speichern(){
    $('fbGesp').textContent = 'Speichert …'; clearTimeout(T);
    T = setTimeout(function(){
      api('fahrten', {id: id, fahrten: f}).then(function(d){
        var i = alle.findIndex(function(x){ return x.id === id; }); if(i !== -1) alle[i] = d.anfrage;
        $('fbGesp').textContent = 'Gespeichert';
        if(tab === 'fahrten') zeichneFahrten();
      }).catch(function(e){ if(e.message !== '401'){ $('fbGesp').textContent = 'Nicht gespeichert'; toast('Speichern hat nicht geklappt.'); } });
    }, 500);
  }
  $('sheetIn').querySelectorAll('.fb-z,.fb-d').forEach(function(inp){ inp.addEventListener('change', function(){ setze(inp.dataset.p, inp.value); tipp(); speichern(); }); });
  $('sheetIn').querySelectorAll('.fb-sn').forEach(function(inp){ inp.addEventListener('change', function(){
    var v = inp.value === '' ? null : Math.round(Number(inp.value)); setze(inp.dataset.p, isFinite(v) ? v : null);
    /* nächsten Stand vorschlagen: + km pro Strecke */
    var alleS = [].slice.call($('sheetIn').querySelectorAll('.fb-sn')), i = alleS.indexOf(inp), n = alleS[i + 1];
    if(v != null && n && !n.value && n.closest('.fb-e') === inp.closest('.fb-e')) n.placeholder = String(v + Math.round(Number(f.km) || 0));
    speichern();
  }); });
  $('fbFz').addEventListener('change', function(){ f.fahrzeug = this.value.trim(); try{ localStorage.setItem('hb_fahrzeug', f.fahrzeug); }catch(e){} speichern(); });
  $('fbKmIn').addEventListener('change', function(){ var v = Number(String(this.value).replace(',', '.')); f.km = isFinite(v) && v >= 0 ? v : 0; speichern(); });
  $('fbJetzt').addEventListener('click', function(){
    var n = naechstes(); if(!n) return;
    var d = new Date(); n.value = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    setze(n.dataset.p, n.value); tipp(); speichern();
    n.classList.add('blink'); setTimeout(function(){ n.classList.remove('blink'); }, 700);
  });
  tipp();
}

/* Excel: ein Blatt pro Monat + Übersicht */
function ladeXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function(ok, nein){
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function(){ ok(window.XLSX); }; s.onerror = nein; document.head.appendChild(s);
  });
}
function excelExport(jahr){
  var b = $('fbXls'); if(b){ b.disabled = true; b.lastChild.textContent = 'Wird erstellt …'; }
  ladeXlsx().then(function(X){
    var zeilen = fbZeilen(jahr), wb = X.utils.book_new(), uebersicht = [['Monat', 'Fahrten', 'Kilometer']], summe = 0, anz = 0;
    MONATE.forEach(function(name, m){
      var z = zeilen.filter(function(r){ return +r.datum.slice(5,7) === m + 1; });
      var km = z.reduce(function(s, r){ return s + (Number(r.km) || 0); }, 0);
      var daten = [['Fahrtenbuch ' + name + ' ' + jahr + ' – Hüpfabenteuer'], [], ['Datum', 'Abfahrt', 'Ankunft', 'Fahrzeug', 'km-Stand Beginn', 'km-Stand Ende', 'Von', 'Nach', 'Zweck', 'Kunde', 'Angebot-Nr.', 'km']];
      z.forEach(function(r){ daten.push([datumKurz(r.datum), r.ab, r.an, r.fz || '', r.kmA == null ? '' : r.kmA, r.kmE == null ? '' : r.kmE, r.von, r.nach, r.zweck, r.kunde, r.nr, Number(r.km) || 0]); });
      daten.push([]); daten.push(['', '', '', '', '', '', '', '', '', '', 'Summe km', Math.round(km * 10) / 10]);
      var ws = X.utils.aoa_to_sheet(daten);
      ws['!cols'] = [{wch:11},{wch:8},{wch:8},{wch:20},{wch:14},{wch:14},{wch:30},{wch:30},{wch:38},{wch:20},{wch:11},{wch:8}];
      X.utils.book_append_sheet(wb, ws, name);
      uebersicht.push([name, z.length, Math.round(km * 10) / 10]); summe += km; anz += z.length;
    });
    uebersicht.push([]); uebersicht.push(['Gesamt ' + jahr, anz, Math.round(summe * 10) / 10]);
    var wu = X.utils.aoa_to_sheet(uebersicht); wu['!cols'] = [{wch:14},{wch:9},{wch:11}];
    X.utils.book_append_sheet(wb, wu, 'Übersicht');
    X.writeFile(wb, 'Fahrtenbuch_' + jahr + '_Huepfabenteuer.xlsx');
  }).catch(function(){ toast('Excel konnte nicht geladen werden. Prüf die Verbindung.'); })
    .finally(function(){ if($('fbXls')){ $('fbXls').disabled = false; $('fbXls').lastChild.textContent = 'Excel ' + jahr; } });
}
