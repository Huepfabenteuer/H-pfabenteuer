<!DOCTYPE html>
<html lang="de">
<head>
<script src="consent.js?v=202610171625"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0B6B6F"/>
<title>Bewertung – Hüpfabenteuer</title>
<link rel="stylesheet" href="fonts.css?v=202610171625"/>
<style>
:root{--petrol:#0B6B6F;--petrol-d:#084F52;--sand:#EFE8DA;--ink:#1A1813;--ink-2:#46413A;--line:rgba(26,24,19,.14);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:var(--sand);color:var(--ink);font-family:'Karla','Helvetica Neue',Arial,sans-serif;}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px;}
.karte{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 22px 24px;text-align:center;}
.logo{width:150px;height:auto;margin:0 auto 18px;display:block;}
h1{font-family:'Bodoni Moda',Didot,'Times New Roman',serif;font-weight:400;font-size:2rem;line-height:1.1;margin-bottom:12px;}
p{color:var(--ink-2);line-height:1.55;margin-bottom:22px;}
.sterne{color:#E8A317;font-size:1.6rem;letter-spacing:.3em;margin:-6px 0 18px;}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:12px;font-weight:800;font-size:1.02rem;text-decoration:none;}
.btn-p{background:var(--petrol);color:#fff;}
.btn-p:hover{background:var(--petrol-d);}
.btn-g{margin-top:10px;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:700;}
.btn svg{width:22px;height:22px;flex:none;}
.klein{margin-top:18px;font-size:.85rem;color:#7A7366;}
.klein a{color:var(--petrol);}
:focus-visible{outline:2px solid var(--petrol);outline-offset:3px;}
</style>
</head>
<body>
<main class="karte">
  <img class="logo" src="angebot-logo.jpg" alt="Hüpfabenteuer – Spring ins Vergnügen" width="420" height="273"/>
  <h1>Danke, dass ihr mit uns gefeiert habt!</h1>
  <p>Wie war euer Fest? Eine kurze Google-Bewertung hilft uns als kleinem Betrieb enorm und dauert nur 30 Sekunden.</p>
  <div class="sterne" aria-hidden="true">★★★★★</div>
  <a class="btn btn-p" href="https://g.page/r/CUE00P_892NPEAE/review" rel="noopener">Auf Google bewerten</a>
  <a class="btn btn-g" href="https://wa.me/436641852634?text=Hallo%20Alex%2C%20kurzes%20Feedback%20zu%20unserem%20Fest%3A%20" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/></svg>
    Lieber direkt an Alex schreiben
  </a>
  <div class="klein">Danke! Alexander · <a href="/">huepfabenteuer.at</a></div>
</main>
</body>
</html>
